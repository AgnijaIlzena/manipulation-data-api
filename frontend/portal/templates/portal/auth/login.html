{% extends 'portal/base.html' %}

{% block title %}Connexion — Data Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        <h1 class="fw-bold mb-1">Connexion</h1>
        <p class="text-muted mb-4">Accédez au Data Portal avec vos identifiants.</p>

        {% if form.errors %}
        <div class="alert alert-danger">
            Identifiants incorrects. Veuillez réessayer.
        </div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Nom d'utilisateur</label>
                        <input type="text"
                               name="username"
                               id="id_username"
                               class="form-control"
                               autofocus
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Mot de passe</label>
                        <input type="password"
                               name="password"
                               id="id_password"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-primary w-100">
                        Se connecter
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function() {
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = 'Connexion en cours...';
    });
</script>
{% endblock %}
